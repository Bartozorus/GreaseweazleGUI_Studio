# Compile GreaseweazleGUI.exe (PS2EXE) sur un runner Windows et l'attache à une
# release GitHub à chaque tag vX.Y, avec pour notes la section correspondante du
# CHANGELOG. Lancement manuel (workflow_dispatch) : régénère les notes d'une
# release existante depuis le CHANGELOG de la branche courante, sans toucher aux
# fichiers attachés. Tag visé : celui saisi dans le formulaire, sinon le dernier
# tag de la branche. Sans aucun tag : simple compilation de test (artefact).
# L'exe est signé avec le certificat du projet si les secrets CODESIGN_PFX_BASE64 et
# CODESIGN_PFX_PASSWORD existent ; sinon il est publié non signé.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag dont régénérer les notes depuis le CHANGELOG (ex. v11.4). Vide = dernier tag de la branche."
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Compiler et publier
    runs-on: windows-latest
    env:
      HAS_CERT: ${{ secrets.CODESIGN_PFX_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Déterminer le tag et le mode
        id: mode
        shell: powershell
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $mode = 'test'; $tag = ''
          if ($env:REF -like 'refs/tags/*') { $mode = 'release'; $tag = $env:REF_NAME }
          else {
            $tag = "$env:INPUT_TAG".Trim()
            if (-not $tag) { $tag = (git describe --tags --abbrev=0 2>$null); if ($LASTEXITCODE -ne 0) { $tag = '' } }
            if ($tag) { $mode = 'notes' }
          }
          "mode=$mode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Mode : $mode / tag : $tag"

      - name: Extraire les notes de release du CHANGELOG
        if: steps.mode.outputs.mode != 'test'
        shell: pwsh
        env:
          TAG: ${{ steps.mode.outputs.tag }}
        run: |
          $ver = $env:TAG.TrimStart('v')
          $lines = Get-Content -LiteralPath 'CHANGELOG.md' -Encoding UTF8
          $out = @(); $in = $false
          foreach ($l in $lines) {
            if ($l -match ('^## \[' + [regex]::Escape($ver) + '\]')) { $in = $true; continue }
            if ($in -and $l -match '^## ') { break }
            if ($in) { $out += $l }
          }
          $body = if ($out.Count -gt 0) { "### Nouveautés de la version $ver`n`n" + (($out -join "`n").Trim()) } else { "Voir le CHANGELOG du dépôt pour la version $ver." }
          [System.IO.File]::WriteAllText('release-notes.md', $body + "`n", (New-Object System.Text.UTF8Encoding($false)))
          Get-Content release-notes.md

      - name: Installer PS2EXE
        if: steps.mode.outputs.mode != 'notes'
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name ps2exe -Scope CurrentUser -Force
          Get-Module -ListAvailable ps2exe | Select-Object Name, Version

      - name: Vérifier que le tag correspond à la version du script
        if: steps.mode.outputs.mode == 'release'
        shell: powershell
        env:
          TAG: ${{ steps.mode.outputs.tag }}
        run: |
          $m = Select-String -LiteralPath 'src\GreaseweazleGUI.ps1' -Pattern '^\$script:Version\s*=\s*''([0-9.]+)''' | Select-Object -First 1
          if (-not $m) { throw 'Version introuvable dans src\GreaseweazleGUI.ps1' }
          $src = $m.Matches[0].Groups[1].Value
          $tag = $env:TAG.TrimStart('v')
          if ($src -ne $tag) { throw "Version du script ($src) différente du tag ($tag)." }
          "Version $src"

      - name: Compiler (PS2EXE, Windows PowerShell 5.1)
        if: steps.mode.outputs.mode != 'notes'
        shell: powershell
        run: .\Build-Exe.ps1 -Sign:$false

      # Signature avec le certificat du projet, fourni en secrets du depot :
      #   CODESIGN_PFX_BASE64   : le fichier .pfx (certificat + cle privee) encode en base64
      #   CODESIGN_PFX_PASSWORD : son mot de passe
      # Un certificat auto-signe donne le statut UnknownError (signe, mais chaine non reconnue
      # par le runner) : c est attendu. Sans secrets, l exe est publie non signe.
      - name: Signer l'exe (certificat fourni en secrets)
        if: steps.mode.outputs.mode != 'notes' && env.HAS_CERT == 'true'
        shell: powershell
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [System.IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
          try {
            $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfx, $env:CODESIGN_PFX_PASSWORD, 'Exportable')
            $sig = Set-AuthenticodeSignature -FilePath 'dist\GreaseweazleGUI.exe' -Certificate $cert -TimestampServer 'http://timestamp.digicert.com' -HashAlgorithm SHA256
          } finally { Remove-Item $pfx -Force -ErrorAction SilentlyContinue }
          "Signature : $($sig.Status) - $($sig.SignerCertificate.Subject) - $($sig.StatusMessage)"
          if (@('Valid', 'UnknownError') -notcontains "$($sig.Status)") { throw "Signature en echec : $($sig.StatusMessage)" }

      - name: Exe non signé (aucun certificat en secrets)
        if: steps.mode.outputs.mode != 'notes' && env.HAS_CERT != 'true'
        shell: powershell
        run: Write-Host 'Aucun secret CODESIGN_PFX_BASE64 dans le depot : exe publie NON signe. Voir README, section Signature.'

      - name: Publier l'artefact de build
        if: steps.mode.outputs.mode != 'notes'
        uses: actions/upload-artifact@v7
        with:
          name: GreaseweazleGUI-${{ github.ref_name }}
          path: |
            dist/GreaseweazleGUI.exe
            src/GreaseweazleGUI.ps1
          if-no-files-found: error

      - name: Créer la release GitHub (tag poussé)
        if: steps.mode.outputs.mode == 'release'
        uses: softprops/action-gh-release@v3
        with:
          name: Greaseweazle Studio ${{ steps.mode.outputs.tag }}
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            dist/GreaseweazleGUI.exe
            src/GreaseweazleGUI.ps1

      - name: Mettre à jour les notes d'une release existante (lancement manuel)
        if: steps.mode.outputs.mode == 'notes'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.mode.outputs.tag }}
          name: Greaseweazle Studio ${{ steps.mode.outputs.tag }}
          body_path: release-notes.md
          generate_release_notes: true
