# Compile GreaseweazleGUI.exe (PS2EXE) sur un runner Windows et l attache a une
# release GitHub a chaque tag vX.Y. Lancement manuel possible (workflow_dispatch) :
# dans ce cas l exe est seulement publie comme artefact de build.
# L exe produit ici n est PAS signe.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compiler GreaseweazleGUI.exe
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Installer PS2EXE
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name ps2exe -Scope CurrentUser -Force
          Get-Module -ListAvailable ps2exe | Select-Object Name, Version

      - name: Verifier que le tag correspond a la version du script
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $m = Select-String -LiteralPath 'src\GreaseweazleGUI.ps1' -Pattern '^\$script:Version\s*=\s*''([0-9.]+)''' | Select-Object -First 1
          if (-not $m) { throw 'Version introuvable dans src\GreaseweazleGUI.ps1' }
          $src = $m.Matches[0].Groups[1].Value
          $tag = $env:TAG.TrimStart('v')
          if ($src -ne $tag) { throw "Version du script ($src) differente du tag ($tag)." }
          "Version $src"

      - name: Compiler (PS2EXE, Windows PowerShell 5.1)
        shell: powershell
        run: .\Build-Exe.ps1

      - name: Publier l artefact de build
        uses: actions/upload-artifact@v7
        with:
          name: GreaseweazleGUI-${{ github.ref_name }}
          path: |
            dist/GreaseweazleGUI.exe
            src/GreaseweazleGUI.ps1
          if-no-files-found: error

      - name: Creer la release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: Greaseweazle Studio ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/GreaseweazleGUI.exe
            src/GreaseweazleGUI.ps1
