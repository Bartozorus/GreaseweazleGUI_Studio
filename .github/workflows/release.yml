# Compile GreaseweazleGUI.exe (PS2EXE) sur un runner Windows et l'attache à une
# release GitHub à chaque tag vX.Y, avec pour notes la section correspondante du
# CHANGELOG. Lancement manuel (workflow_dispatch) :
#   - sans tag : compilation de test, exe publié comme artefact, pas de release ;
#   - avec un tag existant (ex. v11.5) : régénère les notes de cette release depuis
#     le CHANGELOG de la branche courante, sans toucher aux fichiers attachés.
# L'exe produit ici n'est PAS signé : Build-Exe.ps1 est appelé avec -Sign:$false.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existant dont régénérer les notes depuis le CHANGELOG (ex. v11.5). Vide = compilation de test sans release."
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Compiler et publier
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      NOTES_ONLY: ${{ github.event.inputs.tag != '' }}
      IS_TAG_PUSH: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extraire les notes de release du CHANGELOG
        if: env.IS_TAG_PUSH == 'true' || env.NOTES_ONLY == 'true'
        shell: powershell
        run: |
          $ver = $env:TAG.TrimStart('v')
          $lines = Get-Content -LiteralPath 'CHANGELOG.md' -Encoding UTF8
          $out = @(); $in = $false
          foreach ($l in $lines) {
            if ($l -match ('^## \[' + [regex]::Escape($ver) + '\]')) { $in = $true; continue }
            if ($in -and $l -match '^## ') { break }
            if ($in) { $out += $l }
          }
          $body = if ($out.Count -gt 0) { "### Nouveautés de la version $ver`n`n" + (($out -join "`n").Trim()) } else { "Voir le CHANGELOG du dépôt pour la version $ver." }
          [System.IO.File]::WriteAllText('release-notes.md', $body + "`n", (New-Object System.Text.UTF8Encoding($false)))
          Get-Content release-notes.md

      - name: Installer PS2EXE
        if: env.NOTES_ONLY != 'true'
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name ps2exe -Scope CurrentUser -Force
          Get-Module -ListAvailable ps2exe | Select-Object Name, Version

      - name: Vérifier que le tag correspond à la version du script
        if: env.IS_TAG_PUSH == 'true'
        shell: powershell
        run: |
          $m = Select-String -LiteralPath 'src\GreaseweazleGUI.ps1' -Pattern '^\$script:Version\s*=\s*''([0-9.]+)''' | Select-Object -First 1
          if (-not $m) { throw 'Version introuvable dans src\GreaseweazleGUI.ps1' }
          $src = $m.Matches[0].Groups[1].Value
          $tag = $env:TAG.TrimStart('v')
          if ($src -ne $tag) { throw "Version du script ($src) différente du tag ($tag)." }
          "Version $src"

      - name: Compiler (PS2EXE, Windows PowerShell 5.1, sans signature)
        if: env.NOTES_ONLY != 'true'
        shell: powershell
        run: .\Build-Exe.ps1 -Sign:$false

      - name: Publier l'artefact de build
        if: env.NOTES_ONLY != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: GreaseweazleGUI-${{ github.ref_name }}
          path: |
            dist/GreaseweazleGUI.exe
            src/GreaseweazleGUI.ps1
          if-no-files-found: error

      - name: Créer la release GitHub (tag poussé)
        if: env.IS_TAG_PUSH == 'true'
        uses: softprops/action-gh-release@v3
        with:
          name: Greaseweazle Studio ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            dist/GreaseweazleGUI.exe
            src/GreaseweazleGUI.ps1

      - name: Mettre à jour les notes d'une release existante (lancement manuel)
        if: env.NOTES_ONLY == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: Greaseweazle Studio ${{ github.event.inputs.tag }}
          body_path: release-notes.md
          generate_release_notes: true
